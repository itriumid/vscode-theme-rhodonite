name: Announce release

# Posts a release in #releases on Itrium's Discord server: the notes, and links to Open VSX
# and the .vsix. It notifies nobody. The message is built by scripts/announce_release.py.
#
# The Release workflow calls this once a version is published. It can't simply run on
# `release: published`: that release is created with the workflow's own token, and GitHub
# starts no other workflows for events caused by that token. Run it manually (Actions →
# Announce release → Run workflow) with a tag to post a release again.
#
# The DISCORD_RELEASES_WEBHOOK secret holds the webhook address of #releases. Set it with the
# Discord portal's github-secret command, which hands the address to gh without showing it.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      DISCORD_RELEASES_WEBHOOK:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release to post, such as v0.1.0'
        required: true
        type: string

# Any `permissions:` block replaces the default token scopes, so grant per job.
permissions: {}

jobs:
  announce:
    name: Announce on Discord
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
      - name: Post it on Discord
        env:
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: python3 scripts/announce_release.py "$RUNNER_TEMP/release.json"
