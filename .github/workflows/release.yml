name: Release

# Pushing a `v*` tag publishes that version to Open VSX, after the same checks every pull request
# runs, and attaches the .vsix to a GitHub release. The Open VSX token is the OVSX_TOKEN
# repository secret, given only to the steps that talk to Open VSX. See CONTRIBUTING.md, Releasing.
on:
  push:
    tags: ['v*']

# Any `permissions:` block replaces the default token scopes, so grant per job.
permissions: {}

jobs:
  publish:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creates the GitHub release and uploads the .vsix to it.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag is a version and matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$TAG isn't a release tag. Use vMAJOR.MINOR.PATCH, e.g. v0.2.0."
            exit 1
          fi
          version=$(jq -r .version package.json)
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error file=package.json::version is $version, but the tag is $TAG"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      # No dependency cache for a release: what's published is built from a clean install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tests the committed theme files as they are, then packages dist/rhodonite-<version>.vsix.
      - name: Check every color and package the extension
        run: pnpm package

      # The namespace is `publisher` in package.json. Open VSX only creates one through its API, so
      # the first release creates it with the same token; after that this step does nothing.
      - name: Create the Open VSX namespace if it doesn't exist
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
        run: |
          publisher=$(jq -r .publisher package.json)
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://open-vsx.org/api/$publisher")
          case "$status" in
            200) echo "Namespace $publisher exists." ;;
            404) pnpm exec ovsx create-namespace "$publisher" ;;
            *) echo "::error::Open VSX answered $status for namespace $publisher"; exit 1 ;;
          esac

      # --skip-duplicate leaves a version that's already on Open VSX alone, so a release can be
      # run again safely.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
        run: pnpm exec ovsx publish --packagePath "dist/rhodonite-$(jq -r .version package.json).vsix" --skip-duplicate

      - name: Attach the package to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.vsix --clobber
          else
            gh release create "$TAG" dist/*.vsix --title "Rhodonite Theme ${TAG#v}" --generate-notes --verify-tag
          fi
